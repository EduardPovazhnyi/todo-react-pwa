name: Deployment Agent

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run the agent from the Actions tab

# Guardrail: only one agent may deploy at a time.
concurrency:
  group: deployment-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      HEALTH_PATH: ${{ vars.HEALTH_PATH }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --global vercel@latest
      - name: Run deployment agent
        run: node agent.js
        
      - name: Upload deployment history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-history
          path: deployment-history.json
          if-no-files-found: warn
          retention-days: 30

